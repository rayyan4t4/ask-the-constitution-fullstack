services:
  - type: web
    name: ask-constitution-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: python download_model.py && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LLM_MODEL
        value: poolside/laguna-s-2.1:free
